openapi: 3.0.0
info:
  title: API de Reserva de Ingressos
  description: |
    API didática para simulação de reserva de ingressos.
    Acessa o formulário, valida todos os campos e retorna confirmação.
    Suporta criação, atualização e cancelamento de reservas.
  version: 1.2.0
  contact:
    name: Everaldo Barros
    url: https://everaldo-barros.github.io/formulario-reserva-de-ingressos/

servers:
  - url: http://localhost:3000
    description: Servidor Local

tags:
  - name: Formulário
    description: Acesso e envio do formulário de reserva
  - name: Reserva
    description: Atualização e cancelamento de reservas

paths:
  /api/acessar-formulario:
    get:
      tags:
        - Formulário
      summary: Acessa e abre a página do formulário
      description: Navega até a página inicial, clica em Acessar Formulário e retorna a página carregada.
      responses:
        '200':
          description: Formulário acessado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucesso:
                    type: boolean
                    example: true
                  mensagem:
                    type: string
                    example: Formulário acessado com sucesso
                  urlOrigem:
                    type: string
                    example: https://everaldo-barros.github.io/formulario-reserva-de-ingressos/
                  urlDestino:
                    type: string
                    example: https://everaldo-barros.github.io/formulario-reserva-de-ingressos/formulario.html
                  camposEsperados:
                    type: array
                    items:
                      type: string
                  timestamp:
                    type: string
                    format: date-time
        '500':
          description: Erro ao acessar o formulário
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucesso:
                    type: boolean
                    example: false
                  erro:
                    type: string
                  tipo:
                    type: string

  /api/enviar-formulario:
    post:
      tags:
        - Formulário
      summary: Envia e valida os dados da reserva
      description: Recebe todos os campos do formulário, valida regras e retorna confirmação com código.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - sobrenome
                - email
                - telefone
                - jogo
                - setor
                - quantidade
                - formaPagamento
              properties:
                nome:
                  type: string
                  minLength: 2
                  example: Everaldo
                  description: Nome com no mínimo 2 caracteres
                sobrenome:
                  type: string
                  minLength: 2
                  example: Barros
                  description: Sobrenome com no mínimo 2 caracteres
                email:
                  type: string
                  format: email
                  example: everaldo@email.com
                  description: Endereço de e-mail válido
                telefone:
                  type: string
                  example: '49999991234'
                  description: Telefone com DDD, 10 ou 11 dígitos
                jogo:
                  type: string
                  enum:
                    - Flamengo x Santos — 15/10/2026 · 16h00
                    - Palmeiras x Grêmio — 18/10/2026 · 19h30
                    - Corinthians x Bahia — 22/10/2026 · 21h00
                    - Cruzeiro x Vasco — 25/10/2026 · 15h00
                  example: Flamengo x Santos — 15/10/2026 · 16h00
                  description: Jogo selecionado
                setor:
                  type: string
                  enum:
                    - Arquibancada — R$ 80,00
                    - Arquibancada Superior — R$ 100,00
                    - Cadeira Coberta — R$ 150,00
                    - Setor VIP — R$ 300,00
                  example: Arquibancada — R$ 80,00
                  description: Setor escolhido
                quantidade:
                  type: integer
                  minimum: 1
                  maximum: 10
                  example: 2
                  description: Quantidade de ingressos, de 1 a 10
                formaPagamento:
                  type: string
                  enum:
                    - PIX
                    - Cartão de Crédito
                    - Boleto Bancário
                  example: PIX
                  description: Forma de pagamento
                pedidoEspecial:
                  type: string
                  nullable: true
                  example: Preferência por assento no corredor
                  description: Observação adicional, campo opcional

      responses:
        '200':
          description: Reserva realizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucesso:
                    type: boolean
                    example: true
                  mensagem:
                    type: string
                    example: Reserva realizada com sucesso!
                  dadosConfirmados:
                    type: object
                    properties:
                      nomeCompleto:
                        type: string
                        example: Everaldo Barros
                      email:
                        type: string
                        example: everaldo@email.com
                      telefone:
                        type: string
                        example: '49999991234'
                      jogo:
                        type: string
                        example: Flamengo x Santos — 15/10/2026 · 16h00
                      setor:
                        type: string
                        example: Arquibancada — R$ 80,00
                      quantidade:
                        type: integer
                        example: 2
                      valorUnitario:
                        type: number
                        example: 80
                      valorTotal:
                        type: number
                        example: 160
                      formaPagamento:
                        type: string
                        example: PIX
                      pedidoEspecial:
                        type: string
                        example: Nenhum
                  reserva:
                    type: object
                    properties:
                      codigo:
                        type: string
                        example: RES-1789863532398
                      dataHora:
                        type: string
                        format: date-time
                      mensagem:
                        type: string
                        example: Ingressos reservados. Confirmação enviada por e-mail.

        '400':
          description: Erro de validação em um ou mais campos
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucesso:
                    type: boolean
                    example: false
                  mensagem:
                    type: string
                    example: Validação falhou. Verifique os campos abaixo.
                  totalErros:
                    type: integer
                    example: 2
                  erros:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                          example: quantidade
                        mensagem:
                          type: string
                          example: Quantidade deve ser entre 1 e 10

  /api/reserva/{codigo}:
    put:
      tags:
        - Reserva
      summary: Atualizar dados de uma reserva existente
      description: Modifica os dados de uma reserva pelo código, recalcula valores e retorna histórico.
      parameters:
        - name: codigo
          in: path
          required: true
          description: Código da reserva no formato RES-xxxxxxxxxxxxxx
          schema:
            type: string
            example: RES-1789864650638
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - sobrenome
                - email
                - telefone
                - jogo
                - setor
                - quantidade
                - formaPagamento
              properties:
                nome:
                  type: string
                  minLength: 2
                  example: Everaldo
                sobrenome:
                  type: string
                  minLength: 2
                  example: Barros Atualizado
                email:
                  type: string
                  format: email
                  example: novo@email.com
                telefone:
                  type: string
                  example: '49999998888'
                jogo:
                  type: string
                  enum:
                    - Flamengo x Santos — 15/10/2026 · 16h00
                    - Palmeiras x Grêmio — 18/10/2026 · 19h30
                    - Corinthians x Bahia — 22/10/2026 · 21h00
                    - Cruzeiro x Vasco — 25/10/2026 · 15h00
                  example: Palmeiras x Grêmio — 18/10/2026 · 19h30
                setor:
                  type: string
                  enum:
                    - Arquibancada — R$ 80,00
                    - Arquibancada Superior — R$ 100,00
                    - Cadeira Coberta — R$ 150,00
                    - Setor VIP — R$ 300,00
                  example: Setor VIP — R$ 300,00
                quantidade:
                  type: integer
                  minimum: 1
                  maximum: 10
                  example: 3
                formaPagamento:
                  type: string
                  enum:
                    - PIX
                    - Cartão de Crédito
                    - Boleto Bancário
                  example: Cartão de Crédito
                pedidoEspecial:
                  type: string
                  nullable: true
                  example: Alteração de assento

      responses:
        '200':
          description: Reserva atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucesso:
                    type: boolean
                    example: true
                  mensagem:
                    type: string
                    example: Reserva atualizada com sucesso!
                  dadosOriginais:
                    type: object
                    properties:
                      nomeCompleto:
                        type: string
                        example: Everaldo Barros
                      jogo:
                        type: string
                        example: Flamengo x Santos — 15/10/2026 · 16h00
                      setor:
                        type: string
                        example: Arquibancada — R$ 80,00
                      quantidade:
                        type: integer
                        example: 2
                      valorTotal:
                        type: number
                        example: 160
                  dadosAtualizados:
                    type: object
                  reserva:
                    type: object
                    properties:
                      codigo:
                        type: string
                        example: RES-1789864650638
                      dataHoraAtualizacao:
                        type: string
                        format: date-time
                      valorAnterior:
                        type: number
                        example: 160
                      valorAtual:
                        type: number
                        example: 900
        '400':
          description: Dados inválidos na solicitação
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucesso:
                    type: boolean
                    example: false
                  mensagem:
                    type: string
                    example: Não foi possível atualizar. Verifique os dados.
                  totalErros:
                    type: integer
                    example: 1
                  erros:
                    type: array
                    items:
                      type: object
                      properties:
                        campo:
                          type: string
                          example: quantidade
                        mensagem:
                          type: string
                          example: Quantidade deve ser entre 1 e 10
        '404':
          description: Reserva não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucesso:
                    type: boolean
                    example: false
                  mensagem:
                    type: string
                    example: Reserva não encontrada
                  codigo:
                    type: string
                    example: RES-NAO-EXISTE

    delete:
      tags:
        - Reserva
      summary: Cancelar ou excluir uma reserva
      description: Remove a reserva do sistema pelo código. Ação irreversível.
      parameters:
        - name: codigo
          in: path
          required: true
          description: Código da reserva
          schema:
            type: string
            example: RES-1789864650638
      responses:
        '200':
          description: Reserva cancelada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucesso:
                    type: boolean
                    example: true
                  mensagem:
                    type: string
                    example: Reserva cancelada com sucesso!
                  reservaCancelada:
                    type: object
                    properties:
                      codigo:
                        type: string
                        example: RES-1789864650638
                      nomeCompleto:
                        type: string
                        example: Everaldo Barros
                      jogo:
                        type: string
                        example: Flamengo x Santos — 15/10/2026 · 16h00
                      valorTotal:
                        type: number
                        example: 160
                      dataHoraCancelamento:
                        type: string
                        format: date-time
        '404':
          description: Reserva não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucesso:
                    type: boolean
                    example: false
                  mensagem:
                    type: string
                    example: Reserva não encontrada
                  codigo:
                    type: string
                    example: RES-NAO-EXISTE